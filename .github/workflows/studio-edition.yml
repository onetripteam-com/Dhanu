name: Publish MANIFESTO Studio Edition II
on:
  push:
    branches: [main]
    paths:
      - scripts/studio_edition_v2.py
      - .github/workflows/studio-edition.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Compile source transformation
        run: python -m py_compile scripts/studio_edition_v2.py
      - name: Implement all four phases
        run: python scripts/studio_edition_v2.py
      - name: Check chapter order, editorial structure and original media
        run: |
          python - <<'PY'
          from pathlib import Path
          import re,base64
          s=Path('index.html').read_text('utf8')
          ids=[s.index('id="chapter-'+n+'"') for n in ['one','two','three','four','five']]
          assert ids==sorted(ids)
          for key in ['studio-lightbox','studio-restart','studio-reset','final-reveal','chapter-five','archive-trial']:
            assert s.count('id="'+key+'"')==1,key
          assert s.count('MANIFESTO-STUDIO-EDITION-2')==1
          assert s.count('id="manifesto-finale-frame"')==0
          assert s.count('data-final-choice=')==3
          assert 'THE FINAL CHAPTER IS BEING WRITTEN' not in s
          image_data=re.findall(r'data:image/(?:webp|png|jpeg|svg\+xml);base64,([A-Za-z0-9+/=]{100,})',s)
          assert len(image_data)>=40,len(image_data)
          for v in image_data:base64.b64decode(v,validate=True)
          print('Validated source, chapter order,',len(image_data),'image occurrences')
          PY
      - name: Validate all inline scripts using Node.js
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          s=Path('index.html').read_text('utf8')
          scripts=re.findall(r'<script\b[^>]*>(.*?)</script>',s,re.S|re.I)
          for i,script in enumerate(scripts):
            p=Path('/tmp/manifesto-script-%d.js'%i)
            p.write_text(script,encoding='utf8')
          print('Found',len(scripts),'scripts')
          PY
          for f in /tmp/manifesto-script-*.js; do node --check "$f"; done
      - name: Commit production single HTML
        run: |
          if git diff --quiet -- index.html; then
            echo "Studio edition already deployed"; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Publish all four MANIFESTO Studio Edition II phases"
          git push
