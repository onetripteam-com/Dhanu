name: MANIFESTO Studio Edition browser test
on:
  push:
    branches: [main]
    paths:
      - scripts/studio_browser_qa.cjs
      - .github/workflows/studio-browser-qa.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright and Chromium
        run: |
          npm install --no-save playwright@1.58.2
          npx playwright install --with-deps chromium
      - name: Exercise entire interactive five-chapter edition
        run: node scripts/studio_browser_qa.cjs
      - name: Publish factual QA report and screenshots
        if: always()
        run: |
          if [ -f audit/studio-browser-qa.json ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -f audit/studio-browser-qa.json audit/studio-*.jpg
            if ! git diff --cached --quiet; then
              git commit -m "Record Studio Edition II cross-device QA"
              git push
            fi
          fi
