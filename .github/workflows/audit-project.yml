name: Audit MANIFESTO artwork and story

on:
  push:
    branches: [main]
    paths:
      - scripts/audit_project.py
      - .github/workflows/audit-project.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow
      - name: Analyze illustrated HTML
        run: python scripts/audit_project.py
      - name: Keep contact sheets and inventory only
        run: |
          rm -f audit/image-*.jpg audit/image-*.png audit/image-*.webp audit/image-*.svg
          git add audit/inventory.md audit/report.json
          git add -A audit/contact-sheet-*.jpg 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --cached --quiet; then
            git commit -m "Record MANIFESTO artwork and story audit inventory"
            git push
          fi
