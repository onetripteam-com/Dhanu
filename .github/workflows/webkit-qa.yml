name: MANIFESTO WebKit compatibility
on:
  push:
    branches: [main]
    paths:
      - scripts/webkit_qa.cjs
      - .github/workflows/webkit-qa.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  webkit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          npm install --no-save playwright@1.58.2
          npx playwright install --with-deps webkit
      - name: Verify iPhone-like WebKit browser and offline-first interactions
        run: node scripts/webkit_qa.cjs
      - name: Save compatibility results
        if: always()
        run: |
          if [ -f audit/webkit-browser-qa.json ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -f audit/webkit-browser-qa.json audit/webkit-*.jpg
            if ! git diff --cached --quiet; then
              git commit -m "Record WebKit compatibility QA"
              git pull --rebase origin main
              git push
            fi
          fi
