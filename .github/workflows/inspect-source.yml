name: Inspect MANIFESTO source without embedded images
on:
  push:
    branches: [main]
    paths: [scripts/extract_source.py, .github/workflows/inspect-source.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  extract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/extract_source.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audit/source-no-images.html.txt audit/source-sections.json
          if ! git diff --cached --quiet; then
            git commit -m "Record source map for Director's Cut editorial build"
            git push
          fi
