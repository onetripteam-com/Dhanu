name: Fix MANIFESTO returning-reader progress
on:
  push:
    branches: [main]
    paths: [scripts/studio_hotfix.py, .github/workflows/studio-hotfix.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  hotfix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/studio_hotfix.py
      - run: |
          if git diff --quiet -- index.html; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Fix bell progress restoration on return visits"
          git push
