name: Publish MANIFESTO Director's Cut
on:
  push:
    branches: [main]
    paths:
      - scripts/directors_cut.py
      - .github/workflows/directors-cut.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  cut:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Produce final single HTML
        run: python scripts/directors_cut.py
      - name: Verify all chapter boundaries and image integrity
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, base64
          s=Path('index.html').read_text(encoding='utf8')
          ids=[s.index('id="chapter-'+n+'"') for n in ['one','two','three','four','five']]
          assert ids==sorted(ids),ids
          assert s.count('id="chapter-five"')==1
          assert s.count('id="final-choice"')==1
          assert 'THE FINAL CHAPTER IS BEING WRITTEN' not in s
          assert 'srcdoc=' not in s
          assert s.count('id="manifesto-final-launch"')==0
          urls=re.findall(r'data:image/(?:webp|png|jpeg|svg\+xml);base64,([A-Za-z0-9+/=]{100,})',s)
          assert len(urls)>=35,len(urls)
          for u in urls:base64.b64decode(u,validate=True)
          assert len(s)>3000000
          print('Verified',len(urls),'embedded image occurrences, chapter order, no duplicate finale')
          PY
      - name: Commit updated graphic novel
        run: |
          if git diff --quiet -- index.html; then
            echo "Already published"; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Publish illustrated five-chapter Director's Cut"
          git push
